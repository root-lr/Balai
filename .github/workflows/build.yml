name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Lecture seule par défaut : seul le job de release a besoin d'écrire.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        run: swift build -c release

      - name: Tests
        run: swift test

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # Jeton fine-grained (« Contents: read & write » sur le dépôt homebrew-balai) pour mettre à jour le cask.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'app et le .dmg
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Balai.dmg
          generate_release_notes: true

      - name: Mettre à jour le cask Homebrew
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 build/Balai.dmg | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-balai.git" tap
          mkdir -p tap/Casks
          cp packaging/homebrew/balai.rb tap/Casks/balai.rb
          sed -i '' -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
                    -e "s/^  sha256 .*/  sha256 \"${SHA}\"/" tap/Casks/balai.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/balai.rb
          git commit -m "balai ${VERSION}"
          git push
