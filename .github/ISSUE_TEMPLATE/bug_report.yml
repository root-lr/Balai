name: 🐛 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! If Balai deleted (or offered to delete) something it shouldn't, please **don't** use this form: report it privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Balai version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: fda
    attributes:
      label: Full Disk Access granted?
      options: ["Yes", "No", "I don't know"]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
